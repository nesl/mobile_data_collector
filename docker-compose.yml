services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  visualization:
    build: ./event-detector
    command: python visualization.py --host 0.0.0.0
    ports:
      - "5000:5000"

  registry:
    build: ./event-detector
    command: python registry.py
    environment:
      MQTT_HOST: mqtt
      REGISTRY_DB: /data/registry.db
      CE_VISUALIZATION_URL: http://visualization:5000
    volumes:
      - registry-data:/data
    depends_on: [mqtt, visualization]
    restart: unless-stopped

  detector:
    build: ./event-detector
    command: python detector.py --host mqtt --event ${CE_EVENT:-car_gunshot_person} --outside-device ${CE_OUTSIDE_DEVICE:-phone-1} --building-device ${CE_BUILDING_DEVICE:-phone-1} --visualization-url http://visualization:5000
    depends_on: [mqtt, visualization]
    restart: unless-stopped

volumes:
  registry-data:
